[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-cockpit"
version = "0.1.0"
description = "Repo-native research state cockpit and agent skill plugin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "networkx>=3.2",
  "pandas>=2.0",
  "streamlit>=1.32",
  "pyvis>=0.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
research-cockpit = "research_cockpit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_cockpit = [
  "ui/graph_component/frontend/build/**/*",
]
