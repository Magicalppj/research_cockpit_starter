display_name: Research Cockpit
short_description: Inspect and update a YAML-backed research cockpit with generated agent context packs.
default_prompt: >
  Use this plugin from a project-local .agent/skills or .codex/skills directory.
  The research repo should keep state in research_cockpit/.
  Start with research-cockpit bootstrap --root research_cockpit --build --json
  from the research repo root, or research-cockpit bootstrap --root <path> --build --json
  from the plugin root.
  If cwd is unreliable, pass an absolute --root path.
  Read the generated context packs before editing. Use research-cockpit commands for
  supported YAML writes, then run validation and rebuild dashboard context.
