display_name: Research Cockpit
short_description: Read and update bounded project-local research state.
default_prompt: >
  Resolve one canonical research_cockpit root. For an assigned worker, start with
  research-cockpit agent-session-context --root <root> --assignment <assignment_id> --compact --json.
  For a known node, use research-cockpit context --root <root> --id <node_id> --view execution --compact --json.
  Use coordinator bootstrap only when the target is unknown or global triage is required.
  Mutate structured state through research-cockpit commands, keep same-root mutations sequential,
  and normally use --no-build. Start a run with create-run --status running --start-experiment.
  Ingest output once only when a payload exists, then put artifact_record.existing_record_id in
  the closeout. Use complete-run --file to close run, evidence, experiment, one optional follow-up,
  and the assignment cursor atomically.
  When compact output says verified true and additional_verification_required false, do not repeat
  validation or context; otherwise verify changed scope only. Build dashboards and run root smoke
  only for coordinator merge, release, or research-stage closeout; an ordinary agent turn is not
  a milestone handoff.
