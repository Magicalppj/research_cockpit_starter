display_name: Research Cockpit
short_description: Route agents to bounded role-specific research workflows.
default_prompt: >
  Resolve one canonical research_cockpit data root, identify exactly one role, and load only
  its playbook. Assigned workers use capabilities/worker-loop.md and start with
  research-cockpit work open --root <root> --assignment <assignment_id> --json --compact.
  Reviewers use capabilities/reviewer-loop.md; coordinators use capabilities/coordinator-loop.md;
  maintainers use capabilities/maintainer-loop.md. Do not run broad command discovery at startup.
  Query one missing operation with commands --role <role> --name <command>. Treat assignment
  scope as the worker concurrency boundary. When a mutation receipt is internally verified and
  requests no additional verification, do not append validate, context, build, or smoke. Run the
  full gate once only for coordinator milestone_handoff.