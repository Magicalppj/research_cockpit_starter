required:
  - id
  - type
  - title
  - status
  - summary

common_fields:
  id: string
  type:
    enum: [stage, problem, option, experiment, decision, artifact]
  title: string
  status: string
  summary: string
  priority:
    enum: [low, medium, high, critical]
  parent: string|null
  children: list[string]
  tags: list[string]
  created_at: date
  updated_at: date

focus_fields:
  focus_priority: int
  focus_role:
    enum: [current, parent, sibling, child, historical, unrelated]
  show_in_focus:
    enum: [true, false, auto]
  focus_depth_hint: int

evidence_fields:
  evidence_strength:
    enum: [none, weak, medium, strong]
  evidence_summary: string
  supporting_experiments: list[string]
  contradicting_experiments: list[string]

agent_context:
  include: bool
  role:
    enum: [focus, background, evidence, implementation, blocker]
  key_files: list[string]
  key_questions: list[string]
  next_action_hint: string
